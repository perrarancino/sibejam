<!doctype html><html><head><base href="/"><meta charset="utf-8"><title>Trap effects verification</title><style>body{margin:0;background:#20232b;color:white;font:16px system-ui}#controls{position:fixed;top:12px;left:12px;z-index:3;background:#111c;padding:12px}button{padding:8px}#status{max-width:480px}</style></head><body><div id="controls"><button id="overlap">Overlap acid and fire</button><button id="activate">Activate manual traps</button><button id="manual-mine">Detonate mine</button><button id="step-mine">Step on mine</button><button onclick="location.reload()">Reset</button><div id="status">Loading</div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {loadTrap} from '../src/entities/build.js?v=blood-debris-1';
import {CombatManager} from '../src/entities/combat.js?v=blood-layer-1';
import {gameState} from '../src/state/gameState.js';
const scene=new T.Scene();scene.background=new T.Color(0x22252d);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,200);camera.position.set(16,24,26);camera.lookAt(0,0,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x776655,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(5,10,2);scene.add(light);const ground=new T.Mesh(new T.PlaneGeometry(45,35),new T.MeshStandardMaterial({color:0x4d4641}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);
const game={sceneManager:{scene,camera,moonLight:{shadow:{needsUpdate:false}}},decorations:{colliders:[],isBlocked:()=>false},editor:{active:false},story:{dialog:null},boundLimit:50,audio:{playEffect:()=>{}}};const placed=[];game.build={placed,consume(o){combat.fx.destroy(o);scene.remove(o);const i=placed.indexOf(o);if(i>=0)placed.splice(i,1);}};game.decorations.colliders.push({type:'box',x:-2.5,z:6.2,halfX:2,halfZ:.08});const wall=new T.Mesh(new T.BoxGeometry(4,.8,.16),new T.MeshStandardMaterial({color:0x777c85}));wall.position.set(-2.5,.4,6.2);scene.add(wall);const combat=new CombatManager(game);gameState.update({phase:'WAVE_ACTIVE'});combat.active=true;combat.remaining=0;
const names=['spikes','crossbow','mine','rope','packet','log','flamethrower','cannon'];const all=[];
for(let i=0;i<8;i++){const o=await loadTrap(names[i]);o.position.set((i%4)*5-7.5,0,Math.floor(i/4)*7-3.5);o.userData.key=names[i];scene.add(o);placed.push(o);all.push(o);const e=new T.Mesh(new T.CapsuleGeometry(.25,.6,3,5),combat.hostileMaterial);e.position.copy(o.position);e.position.y=.65;e.position.z+=i===1||i===2?2: .6;scene.add(e);combat.enemies.push({mesh:e,hp:100000,ally:false,attack:0,slow:1});}
document.querySelector('#manual-mine').onclick=()=>combat.activate(all[2]);document.querySelector('#step-mine').onclick=()=>{combat.enemies[2].mesh.position.copy(all[2].position);combat.enemies[2].mesh.position.y=.65;};
document.querySelector('#overlap').onclick=()=>{all[4].position.copy(all[6].position);combat.activate(all[4]);combat.activate(all[6]);};
document.querySelector('#activate').onclick=()=>{for(const o of [...placed])combat.activate(o);};let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;combat.update(dt);renderer.render(scene,camera);document.querySelector('#status').textContent=`Traps ${placed.length} · Effects ${combat.effects.length} · Particles ${combat.fx.particles.length} · Debris ${combat.fx.fragments.length} · Mine detonated ${!!all[2].userData.detonated} · Mine HP target ${combat.enemies[2]?.hp} · Blood ${combat.fx.bloodDrops.length} · Stains ${combat.fx.stains.length} · Log Z ${all[5].position.z.toFixed(2)} · Spike base scale ${all[0].scale.y.toFixed(2)} · Spike heads ${all[0].getObjectByName('spike-heads').scale.y.toFixed(2)}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
