<!doctype html>
<html lang="ru">
<head>
  <base href="../">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060408">
  <title>Сестра Агата: Освященный Дозор (Sibejam 2.5D)</title>
  <style>
    @font-face {
      font-family: 'Alegreya';
      src: url('./assets/fonts/alegreya/Alegreya.ttf') format('truetype');
      font-weight: 400 900;
      font-display: swap;
    }
    body, body * { font-family: 'Alegreya', Georgia, serif !important; }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #060408;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #game-canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 1. ТЯЖЕЛАЯ КИНЕМАТОГРАФИЧЕСКАЯ ВИНЬЕТКА */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 30%,
        rgba(3, 1, 5, 0.14) 60%,
        rgba(2, 1, 4, 0.38) 82%,
        rgba(1, 0, 2, 0.65) 100%
      );
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.4);
      mix-blend-mode: multiply;
    }

    /* 2. ПЛЕНОЧНОЕ ЗЕРНО (FILM GRAIN) */
    .film-grain-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 55;
      opacity: 0.075;
      mix-blend-mode: overlay;
    }
    body.low-graphics .film-grain-canvas { display: none; }
  </style>
</head>
<body>
  <!-- Three.js Canvas Container -->
  <div id="game-canvas-container"></div>

  <!-- Тяжелая виньетка по краям экрана -->
  <div class="vignette-overlay"></div>

  <!-- Холст пленочного зерна (Film Grain) -->
  <canvas class="film-grain-canvas" id="film-grain-canvas"></canvas>

  <!-- Скрипт процедурного зерна пленки (18 FPS) -->
  <script>
    (function initFilmGrain() {
      const canvas = document.getElementById('film-grain-canvas');
      const ctx = canvas.getContext('2d');
      const patternSize = 180;
      const patterns = [];
      const numPatterns = 4;

      // Предварительная генерация 4 кадров аналогового зерна
      for (let p = 0; p < numPatterns; p++) {
        const pCanvas = document.createElement('canvas');
        pCanvas.width = patternSize;
        pCanvas.height = patternSize;
        const pCtx = pCanvas.getContext('2d');
        const imgData = pCtx.createImageData(patternSize, patternSize);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
          const val = (Math.random() * 255) | 0;
          data[i] = val;
          data[i + 1] = val;
          data[i + 2] = val;
          data[i + 3] = (Math.random() * 110 + 40) | 0; // полупрозрачный шум
        }
        pCtx.putImageData(imgData, 0, 0);
        patterns.push(ctx.createPattern(pCanvas, 'repeat'));
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      let currentPatternIndex = 0;
      let lastGrainTime = performance.now();
      const grainInterval = 1000 / 18; // 18 кадров в секунду (пленочный проектор)

      function loop(now) {
        if (!document.hidden && !document.body.classList.contains('low-graphics') && !document.body.classList.contains('game-paused') && now - lastGrainTime >= grainInterval) {
          currentPatternIndex = (currentPatternIndex + 1) % numPatterns;
          ctx.fillStyle = patterns[currentPatternIndex];
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          lastGrainTime = now;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>

  <!-- Точка входа игры -->
  <script type="module" src="./src/main.js?v=world-sound-paths-12"></script>
<script type="module" src="./scripts/route-qa.js"></script></body>
</html>
