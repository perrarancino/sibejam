<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060408">
  <title>Сестра Агата: Освященный Дозор (Sibejam 2.5D)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #060408;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #game-canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- Three.js Canvas Container (Чистый игровой экран без интерфейса) -->
  <div id="game-canvas-container"></div>

  <!-- Точка входа игры -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
