<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111814"><title>Змейка — маленькая аркада</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eadc;color:#18241b;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,980px)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #9fa99b;padding-bottom:18px}.brand{font-weight:900;letter-spacing:.12em;font-size:14px}.badge{font-size:12px;font-weight:800;letter-spacing:.12em;color:#58705b}.layout{display:grid;grid-template-columns:1fr 1.15fr;gap:50px;align-items:center;padding:48px 0}.eyebrow{color:#617c5c;font-size:12px;letter-spacing:.2em;font-weight:800}h1{font-size:clamp(55px,9vw,100px);line-height:.9;letter-spacing:-.07em;margin:18px 0 24px}p{color:#586859;line-height:1.6;max-width:330px}.stats{display:flex;gap:45px;margin:36px 0}.label{font-size:11px;font-weight:800;letter-spacing:.15em;color:#788778}.number{font-size:36px;font-weight:800;line-height:1.3}.button{border:0;border-radius:8px;background:#263f2b;color:white;padding:15px 22px;font-weight:800;cursor:pointer}.button:hover{background:#3c6242}.hint{font-size:13px}.board{background:#253b2c;padding:14px;border-radius:18px;box-shadow:0 20px 0 #c7cebc,0 30px 50px #263f2b22}.board-top{display:flex;justify-content:space-between;color:#b4c6aa;font-size:11px;letter-spacing:.15em;font-weight:800;padding:4px 4px 12px}canvas{display:block;width:100%;aspect-ratio:1;background:#b8ca9e;border-radius:7px;touch-action:none}.controls{display:none;grid-template-columns:repeat(3,48px);justify-content:center;gap:5px;margin-top:25px}.controls button{height:44px;border:0;border-radius:7px;background:#d1d9c7;color:#263f2b;font-size:20px;font-weight:bold}.controls .up{grid-column:2}.controls .left{grid-column:1}footer{border-top:1px solid #9fa99b;padding-top:16px;display:flex;justify-content:space-between;color:#758474;font-size:11px;letter-spacing:.12em;font-weight:700}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:26px;padding:32px 0}.intro h1{font-size:64px;margin:12px 0}.stats{margin:18px 0}.controls{display:grid}footer{margin-top:24px}.hint{margin-bottom:0}}
</style></head><body><main class="app"><header><div class="brand">● SNAKE CLUB</div><div class="badge">ИГРА № 001</div></header><div class="layout"><section class="intro"><div class="eyebrow">КЛАССИКА, КОТОРАЯ ВСЕГДА С ТОБОЙ</div><h1>Ешь.<br>Расти.<br>Повтори.</h1><p>Собирай яблоки, становись длиннее и постарайся не запутаться в собственном хвосте.</p><div class="stats"><div><div class="label">СЧЁТ</div><div class="number" id="score">00</div></div><div><div class="label">РЕКОРД</div><div class="number" id="best">00</div></div></div><button class="button" id="start">Начать игру →</button><p class="hint" id="message" aria-live="polite">Стрелки или WASD · пробел — пауза</p></section><section aria-label="Игровое поле"><div class="board"><div class="board-top"><span>ЗМЕЙКА / АРКАДА</span><span>● READY</span></div><canvas id="game" width="480" height="480" aria-label="Игровое поле змейки"></canvas></div><div class="controls" aria-label="Управление"><button class="up" data-dir="up" aria-label="Вверх">↑</button><button class="left" data-dir="left" aria-label="Влево">←</button><button data-dir="down" aria-label="Вниз">↓</button><button data-dir="right" aria-label="Вправо">→</button></div></section></div><footer><span>МАЛЕНЬКАЯ ИГРА ДЛЯ БОЛЬШОГО ПЕРЕРЫВА</span><span>УДАЧИ ✳</span></footer></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),message=document.querySelector('#message'),start=document.querySelector('#start');const N=20,S=24;let snake,dir,next,food,score=0,timer=null,state='ready',best=0;try{best=Number(localStorage.getItem('snake-best'))||0}catch{}bestEl.textContent=String(best).padStart(2,'0');function placeFood(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});return free.length?free[Math.floor(Math.random()*free.length)]:null}function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next=dir;score=0;scoreEl.textContent='00';food=placeFood();draw()}function draw(){ctx.clearRect(0,0,480,480);ctx.strokeStyle='#a9be91';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,480);ctx.moveTo(0,i*S);ctx.lineTo(480,i*S);ctx.stroke()}if(food){ctx.fillStyle='#df714d';ctx.beginPath();ctx.arc(food.x*S+12,food.y*S+12,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3e6141';ctx.fillRect(food.x*S+12,food.y*S+2,3,5)}snake.forEach((p,i)=>{ctx.fillStyle=i?'#486e46':'#263f2b';ctx.beginPath();ctx.roundRect(p.x*S+2,p.y*S+2,20,20,5);ctx.fill();if(!i){ctx.fillStyle='#d9e8c4';ctx.beginPath();ctx.arc(p.x*S+12+dir.x*4-dir.y*4,p.y*S+12+dir.y*4+dir.x*4,2,0,7);ctx.arc(p.x*S+12+dir.x*4+dir.y*4,p.y*S+12+dir.y*4-dir.x*4,2,0,7);ctx.fill()}})}function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=food&&head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){end('Игра окончена! Попробуй ещё раз.');return}snake.unshift(head);if(eat){score++;scoreEl.textContent=String(score).padStart(2,'0');if(score>best){best=score;bestEl.textContent=String(best).padStart(2,'0');try{localStorage.setItem('snake-best',best)}catch{}}food=placeFood();if(!food){draw();end('Победа! Всё поле заполнено.');return}}else snake.pop();draw()}function end(text){clearInterval(timer);timer=null;state='over';message.textContent=text;start.textContent='Играть снова →'}function play(){if(state==='paused'){state='playing';message.textContent='Стрелки или WASD · пробел — пауза';start.textContent='Пауза';timer=setInterval(tick,130);return}if(state==='playing'){pause();return}reset();state='playing';message.textContent='Стрелки или WASD · пробел — пауза';start.textContent='Пауза';timer=setInterval(tick,130)}function pause(){if(state==='playing'){clearInterval(timer);timer=null;state='paused';message.textContent='Пауза';start.textContent='Продолжить →'}}function turn(x,y){if(state!=='playing')return;if(x===-dir.x&&y===-dir.y)return;next={x,y}}start.addEventListener('click',play);document.addEventListener('keydown',e=>{const keys={ArrowUp:[0,-1],w:[0,-1],ц:[0,-1],ArrowDown:[0,1],s:[0,1],ы:[0,1],ArrowLeft:[-1,0],a:[-1,0],ф:[-1,0],ArrowRight:[1,0],d:[1,0],в:[1,0]};const v=keys[e.key]||keys[e.key.toLowerCase()];if(v){e.preventDefault();turn(...v)}else if(e.code==='Space'){e.preventDefault();if(state==='playing')pause();else play()}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];turn(...d)}));let touch;canvas.addEventListener('touchstart',e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});canvas.addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));touch=null},{passive:true});reset();
</script></body></html>
