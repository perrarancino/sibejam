<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181a1d"><title>Лабиринт</title><style>
*{box-sizing:border-box}body{margin:0;background:#181a1d;color:#efefed;font:15px system-ui,sans-serif;overflow:hidden}#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:24px;pointer-events:none}.title{font-weight:800;letter-spacing:.13em;font-size:13px}.sub{color:#a8aaac;font-size:12px;margin-top:7px}.reset{pointer-events:auto;background:#303337;border:1px solid #55595d;border-radius:8px;color:#eee;padding:10px 14px;font:inherit;cursor:pointer}.message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#222e;border:1px solid #666;border-radius:12px;padding:24px 32px;text-align:center;display:none}.message.show{display:block}.message strong{display:block;font-size:23px;margin-bottom:8px}.message span{color:#bcbcbc}.controls{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:24px;display:grid;grid-template-columns:repeat(3,52px);gap:6px}.controls button{height:50px;border:1px solid #73787b;border-radius:8px;background:#303438d9;color:white;font-size:22px;touch-action:none}.up{grid-column:2}.left{grid-column:1}.legend{position:fixed;bottom:24px;left:24px;color:#b1b4b5;font-size:12px;line-height:1.8;pointer-events:none}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#cddbd1;margin-right:7px}.exit{background:#75bd89}@media(max-width:600px){.hud{padding:16px}.legend{bottom:18px;left:16px}.controls{right:16px;bottom:16px;grid-template-columns:repeat(3,44px)}.controls button{height:42px}.sub{max-width:180px}}
</style></head><body><div id="view"></div><div class="hud"><div><div class="title">ЛАБИРИНТ / 01</div><div class="sub">Найди путь к зелёному выходу</div></div><button class="reset" id="reset">Новый лабиринт ↻</button></div><div class="legend"><div><i class="dot"></i>Ты</div><div><i class="dot exit"></i>Выход</div><div>WASD / стрелки</div></div><div class="controls" aria-label="Управление"><button class="up" data-key="ArrowUp" aria-label="Вверх">↑</button><button class="left" data-key="ArrowLeft" aria-label="Влево">←</button><button data-key="ArrowDown" aria-label="Вниз">↓</button><button data-key="ArrowRight" aria-label="Вправо">→</button></div><div class="message" id="win" role="status"><strong>Выход найден!</strong><span>Создай новый лабиринт кнопкой сверху.</span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const size=21, cell=2, radius=.34; let maze, player, exit, won=false; const keys=new Set();
const scene=new THREE.Scene();scene.background=new THREE.Color(0x181a1d);const camera=new THREE.OrthographicCamera(-22,22,22,-22,.1,150);camera.position.set(45,60,45);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x41454a,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-18,35,12);scene.add(light);
const world=new THREE.Group();scene.add(world);const wallGeo=new THREE.BoxGeometry(cell,2,cell),wallMat=new THREE.MeshStandardMaterial({color:0x777b7d,roughness:1});const floorMat=new THREE.MeshStandardMaterial({color:0x373a3c,roughness:1});const ballMat=new THREE.MeshStandardMaterial({color:0xe4eee6,roughness:.55});const exitMat=new THREE.MeshStandardMaterial({color:0x6aaf7e,emissive:0x1e5730,emissiveIntensity:.5});const coord=n=>(n-(size-1)/2)*cell;
function generate(){const a=Array.from({length:size},()=>Array(size).fill(1));const stack=[[1,1]];a[1][1]=0;while(stack.length){const [x,z]=stack[stack.length-1];const choices=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dz])=>x+dx>0&&x+dx<size-1&&z+dz>0&&z+dz<size-1&&a[z+dz][x+dx]);if(!choices.length){stack.pop();continue}const [dx,dz]=choices[Math.floor(Math.random()*choices.length)];a[z+dz/2][x+dx/2]=0;a[z+dz][x+dx]=0;stack.push([x+dx,z+dz])}return a}
function build(){while(world.children.length)world.remove(world.children[0]);maze=generate();won=false;keys.clear();document.querySelector('#win').classList.remove('show');const floor=new THREE.Mesh(new THREE.BoxGeometry(size*cell,.4,size*cell),floorMat);floor.position.y=-.2;world.add(floor);for(let z=0;z<size;z++)for(let x=0;x<size;x++)if(maze[z][x]){const wall=new THREE.Mesh(wallGeo,wallMat);wall.position.set(coord(x),1,coord(z));world.add(wall)}exit=new THREE.Mesh(new THREE.BoxGeometry(1.2,.08,1.2),exitMat);exit.position.set(coord(size-2),2.1,coord(size-2));world.add(exit);player=new THREE.Mesh(new THREE.SphereGeometry(radius,20,12),ballMat);player.position.set(coord(1),2.4,coord(1));world.add(player)}
function blocked(x,z){const minX=Math.floor((x-radius)/cell+(size-1)/2+.5),maxX=Math.floor((x+radius)/cell+(size-1)/2+.5),minZ=Math.floor((z-radius)/cell+(size-1)/2+.5),maxZ=Math.floor((z+radius)/cell+(size-1)/2+.5);for(let j=minZ;j<=maxZ;j++)for(let i=minX;i<=maxX;i++)if(!maze[j]||maze[j][i]!==0)return true;return false}
const keymap={arrowup:'up',w:'up','ц':'up',arrowdown:'down',s:'down','ы':'down',arrowleft:'left',a:'left','ф':'left',arrowright:'right',d:'right','в':'right'};function change(e,on){const k=keymap[e.key.toLowerCase()];if(!k)return;e.preventDefault();if(on)keys.add(k);else keys.delete(k)}window.addEventListener('keydown',e=>change(e,true));window.addEventListener('keyup',e=>change(e,false));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const k=keymap[b.dataset.key.toLowerCase()];b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});document.querySelector('#reset').addEventListener('click',build);
function resize(){const aspect=innerWidth/innerHeight;const half=32;camera.left=-half*Math.max(aspect,1);camera.right=half*Math.max(aspect,1);camera.top=half*Math.max(1,1/aspect);camera.bottom=-half*Math.max(1,1/aspect);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}window.addEventListener('resize',resize);resize();build();let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!won){let dx=(keys.has('right')?1:0)-(keys.has('left')?1:0),dz=(keys.has('down')?1:0)-(keys.has('up')?1:0);const len=Math.hypot(dx,dz)||1;dx=dx/len*5*dt;dz=dz/len*5*dt;if(!blocked(player.position.x+dx,player.position.z))player.position.x+=dx;if(!blocked(player.position.x,player.position.z+dz))player.position.z+=dz;if(Math.hypot(player.position.x-exit.position.x,player.position.z-exit.position.z)<.6){won=true;keys.clear();document.querySelector('#win').classList.add('show')}}renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
